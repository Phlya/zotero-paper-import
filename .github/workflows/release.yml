name: Release

# Runs when a version tag is pushed (scripts/release.sh does that)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./plugin/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: ./test/run-tests.sh

      - name: Build
        run: |
          ./build.sh
          node scripts/make-updates-json.js "build/teams-import-$VERSION.xpi" > build/updates.json
          cat build/updates.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/teams-import-$VERSION.xpi" \
            build/updates.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
