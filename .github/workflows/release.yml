name: Release

# Runs when a plugin version tag like teams-import-v0.7.0 is pushed (scripts/release.sh does that)
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

# Each release extends the current updates.json, so run one at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read plugin and version from the tag
        run: |
          plugin="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          manifest="plugins/$plugin/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "No plugin '$plugin' for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          manifest_version=$(node -p "require('./$manifest').version")
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match $manifest version $manifest_version" >&2
            exit 1
          fi
          echo "PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=$(node -p "require('./$manifest').name")" >> "$GITHUB_ENV"

      - name: Test
        run: ./test/run-tests.sh

      - name: Build
        run: |
          ./build.sh "$PLUGIN"
          # Start from the current manifest so the other plugin's entry is kept
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/updates/updates.json" \
            -o build/previous-updates.json || rm -f build/previous-updates.json
          node scripts/make-updates-json.js "$PLUGIN" "build/$PLUGIN-$VERSION.xpi" build/previous-updates.json \
            > build/updates.json
          cat build/updates.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/$PLUGIN-$VERSION.xpi" \
            build/updates.json \
            --title "$NAME $VERSION" \
            --latest \
            --generate-notes

      # Both plugins' update_url point at the "updates" release's updates.json. A fixed release is
      # used because GitHub's releases/latest/download/ only follows plain version tags (v1.2.3).
      - name: Update the plugins' update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view updates >/dev/null 2>&1 || gh release create updates \
            --title "Update manifest" \
            --notes "updates.json here tells Zotero about new versions of both plugins. Not a plugin release; download plugins from the other releases." \
            --latest=false
          gh release upload updates build/updates.json --clobber
